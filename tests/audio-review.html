<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soundstudio · Altstadt</title>
<style>body{background:#141917;color:#e4e8df;font:16px system-ui;max-width:1000px;margin:50px auto;padding:0 24px}h1{font-size:40px;margin-bottom:8px}p{color:#b1bdb4}button,select,input{font:inherit}button,select{background:#26362f;color:#ecf2e5;border:1px solid #4f6559;border-radius:6px;padding:12px;cursor:pointer}button:hover{background:#3a5344}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:30px 0}#sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}small{color:#91aa9b}#status{display:block;margin:18px 0;color:#b6d39e}</style>
<h1>Soundstudio</h1><p>Waffen, Schritte und Körperteilaktionen einzeln probehören. Die Lautstärke zunächst niedrig einstellen.</p>
<div class="controls"><button id="start">Audio aktivieren</button><label>Lautstärke <input id="volume" type="range" min="0" max="1" step=".01" value=".5"></label><label>Position <select id="position"><option value="center">Direkt</option><option value="left">Links · 3 m</option><option value="right">Rechts · 3 m</option><option value="far">Entfernt · 30 m</option><option value="wall">Hinter einer Wand</option></select></label><button id="stop">Alles stoppen</button></div>
<output id="status">Bereit zum Aktivieren</output><div id="sounds"></div><p><small>Originale prozedurale Effekte, vier Varianten je Effekt. Die Spielszene ergänzt Distanz, Raumdämpfung, Kadenz und Ereigniszuordnung.</small></p><script type="module" src="./audio-review.ts"></script></html>
